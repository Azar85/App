plugins { id 'com.android.application' }

android {
    namespace 'ir.cluphamed.club'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.cluphamed.club'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
