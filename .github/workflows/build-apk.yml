name: Build test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK_MGR="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MGR" ]; then
            SDK_MGR="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          if [ -z "$SDK_MGR" ]; then echo "Android sdkmanager missing"; exit 1; fi
          echo "SDK_MGR=$SDK_MGR" >> "$GITHUB_ENV"
      - name: Install required Android platform
        run: |
          yes | "$SDK_MGR" --licenses >/dev/null || true
          "$SDK_MGR" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Store APK
        uses: actions/upload-artifact@v4
        with:
          name: ClupHamedSavaran-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
